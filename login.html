<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="login.css">
    <title>Registration Form</title>
</head>
<body>
    <div class="container">
        <div class="signup-section">
            <h2>Registration Form</h2>
            <form action="registrationform.html">
                <label for="input">Student Name: </label>
                <input type="text" required placeholder="Enter your name"> <br>
                <label for="input">Branch: </label>
                <input type="text" required placeholder="Enter your Branch"> <br>
                <label for="input">Semester : </label>
                <input type="text" required placeholder="Enter your semester"> <br>
                <label for="input">E-Mail: </label>
                <input type="email" required placeholder="Enter your E-mail"> <br>
                <label for="input">Password: </label>
                <input type="password" required placeholder="Enter your password"> <br>
                <button>Submit</button>
            </form>
        </div>
        <div class="login-section">
            <h1>Welcome Back!</h1>
            <p>Keep connected with us please login with your personal info</p>
           <a href="registrationform.html"> <button class="sign-in">SIGN IN</button></a>
        </div>
    </div>
</body>
</html>
